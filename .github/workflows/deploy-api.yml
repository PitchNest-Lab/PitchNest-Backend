name: Deploy API

# Every push to main releases the backend:
#   1. test, build and verify the Lambda package
#   2. upload it to pitchnest-prod-api and publish an immutable version
#   3. smoke-test that version directly, before any user reaches it
#   4. move the `live` alias, then check the public API (moving it back on failure)
#   5. ask Render to deploy the same commit (live-pitch WebSocket server)
#
# Database migrations are never run here: apply them in Supabase first.
# One-time setup (AWS role, GitHub secrets): docs/deployment.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FUNCTION_NAME: pitchnest-prod-api
  AWS_REGION: eu-west-2
  API_URL: https://mkrkiditq5.execute-api.eu-west-2.amazonaws.com

jobs:
  package:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Run application and security tests
        # Placeholders only: the tests stub every external service, and the
        # .invalid hosts guarantee nothing real can be reached.
        env:
          NODE_ENV: development
          PORT: "3000"
          SUPABASE_URL: https://ci-placeholder.invalid
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          ALLOWED_ORIGIN: http://localhost:5174
          CLIENT_URL: http://localhost:5174
          APP_BASE_URL: http://localhost:5174
          AZURE_OPENAI_ENDPOINT: https://ci-placeholder.invalid
          AZURE_OPENAI_API_KEY: ci-placeholder
          AZURE_OPENAI_API_VERSION: 2026-07-09
          AZURE_OPENAI_DEPLOYMENT: gpt-5.6-luna
          AZURE_SPEECH_KEY: ci-placeholder
          AZURE_SPEECH_REGION: eastus
          RESEND_API_KEY: re_ci_placeholder
          GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
          TRIAL_JOBS_ENABLED: "false"
          RESEARCH_ENABLED: "false"
        run: |
          JWT_SECRET="$(openssl rand -hex 32)"
          export JWT_SECRET
          npm test
      - name: Verify combined migrations
        run: npm run test:migrations
      - name: Build the Lambda package
        run: npm run build:lambda:prod
      - name: Verify the Lambda package
        run: npm run verify:lambda:prod
      - name: Keep the package for the release job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambda-package
          path: |
            dist/pitchnest-api-prod.zip
            dist/pitchnest-api-prod.manifest.json
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release to production
    needs: package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: release-prod-api
      cancel-in-progress: false
    steps:
      - name: Fetch the verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lambda-package
          path: dist

      - name: Sign in to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deploy-api-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Publish, smoke-test and promote the Lambda version
        id: lambda
        shell: bash
        run: |
          set -euo pipefail
          zip=dist/pitchnest-api-prod.zip
          expected=$(jq -r .sha256_base64 dist/pitchnest-api-prod.manifest.json)
          built_from=$(jq -r .gitCommit dist/pitchnest-api-prod.manifest.json)
          if [ "$built_from" != "$GITHUB_SHA" ]; then
            echo "::error::The package was built from $built_from, not $GITHUB_SHA."
            exit 1
          fi

          # Every AWS call below prints one field only: function configuration
          # (including environment variables) must never reach public logs.
          previous=$(aws lambda get-alias --function-name "$FUNCTION_NAME" --name live \
            --query FunctionVersion --output text)
          echo "live is on version $previous"

          uploaded=$(aws lambda update-function-code --function-name "$FUNCTION_NAME" \
            --zip-file "fileb://$zip" --query CodeSha256 --output text)
          if [ "$uploaded" != "$expected" ]; then
            echo "::error::Uploaded CodeSha256 $uploaded does not match the package ($expected)."
            exit 1
          fi
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"

          # --code-sha256 refuses to publish if $LATEST changed in the meantime.
          version=$(aws lambda publish-version --function-name "$FUNCTION_NAME" \
            --code-sha256 "$expected" --description "main ${GITHUB_SHA:0:7} (run $GITHUB_RUN_ID)" \
            --query Version --output text)
          echo "published version $version"

          smoke() {
            local path=$1 payload function_error status
            payload=$(jq -cn --arg p "$path" '{version:"2.0",routeKey:"$default",rawPath:$p,rawQueryString:"",
              headers:{host:"smoke"},isBase64Encoded:false,
              requestContext:{http:{method:"GET",path:$p,protocol:"HTTP/1.1",sourceIp:"127.0.0.1",userAgent:"smoke"},stage:"$default"}}')
            function_error=$(aws lambda invoke --function-name "$FUNCTION_NAME" --qualifier "$version" \
              --cli-binary-format raw-in-base64-out --payload "$payload" \
              --query FunctionError --output text smoke.json)
            status=$(jq -r '.statusCode // "none"' smoke.json)
            echo "version $version: GET $path -> $status"
            [ "$function_error" = "None" ] && [ "$status" = "200" ]
          }
          for path in /api/health /api/public/businesses; do
            if ! smoke "$path"; then
              echo "::error::Version $version failed GET $path. live stays on version $previous."
              exit 1
            fi
          done

          if [ "$version" != "$previous" ]; then
            aws lambda update-alias --function-name "$FUNCTION_NAME" --name live \
              --function-version "$version" --query FunctionVersion --output text > /dev/null
          fi
          echo "live -> version $version"

          healthy=false
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 -o /dev/null "$API_URL/api/health"; then healthy=true; break; fi
            sleep 10
          done
          if [ "$healthy" != true ]; then
            echo "::error::The public API failed its health check. Moving live back to version $previous."
            aws lambda update-alias --function-name "$FUNCTION_NAME" --name live \
              --function-version "$previous" --query FunctionVersion --output text > /dev/null
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - name: Deploy the live-pitch server (Render)
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not set, so Render was not deployed. Deploy it by hand."
            exit 0
          fi
          curl -fsS -X POST -o /dev/null "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"
          echo "Render deploy of ${GITHUB_SHA:0:7} requested"

      - name: Release summary
        shell: bash
        env:
          VERSION: ${{ steps.lambda.outputs.version }}
          PREVIOUS: ${{ steps.lambda.outputs.previous }}
        run: |
          {
            echo "### Released ${GITHUB_SHA:0:7}"
            echo "- API (Lambda \`$FUNCTION_NAME\`): \`live\` is on version **$VERSION** (was $PREVIOUS)."
            echo "- Live-pitch server (Render): deploy requested; it is live a few minutes later."
            echo "- To undo the API: **Actions → Roll back API → Run workflow**, version **$PREVIOUS**."
          } >> "$GITHUB_STEP_SUMMARY"
