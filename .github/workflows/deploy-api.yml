name: Deploy API

# dev  -> DEV:  Lambda pitchnest-dev-api (API l5isutzx18) + Render DEV service
# main -> PROD: Lambda pitchnest-prod-api, alias `live` (API mkrkiditq5) + Render PROD service
#
# Every run tests, builds and verifies one package; the release job ships that
# exact package (scripts/release-lambda.sh), then asks Render to deploy the
# same commit. Pull requests stop after the package checks.
# Database migrations are never run here: apply them in Supabase first.
# One-time setup and rollback: docs/deployment.md.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: eu-west-2

jobs:
  package:
    name: Test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Type-check
        run: npm run lint
      - name: Check the release scripts
        run: |
          bash -n scripts/release-lambda.sh
          bash -n scripts/explain-aws-signin.sh
          shellcheck --severity=warning scripts/release-lambda.sh scripts/explain-aws-signin.sh
      - name: Run application and security tests
        # Placeholders only: the tests stub every external service, and the
        # .invalid hosts guarantee nothing real can be reached.
        env:
          NODE_ENV: development
          PORT: "3000"
          SUPABASE_URL: https://ci-placeholder.invalid
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          ALLOWED_ORIGIN: http://localhost:5174
          CLIENT_URL: http://localhost:5174
          APP_BASE_URL: http://localhost:5174
          AZURE_OPENAI_ENDPOINT: https://ci-placeholder.invalid
          AZURE_OPENAI_API_KEY: ci-placeholder
          AZURE_OPENAI_API_VERSION: 2026-07-09
          AZURE_OPENAI_DEPLOYMENT: gpt-5.6-luna
          AZURE_SPEECH_KEY: ci-placeholder
          AZURE_SPEECH_REGION: eastus
          RESEND_API_KEY: re_ci_placeholder
          GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
          TRIAL_JOBS_ENABLED: "false"
          RESEARCH_ENABLED: "false"
        run: |
          JWT_SECRET="$(openssl rand -hex 32)"
          export JWT_SECRET
          npm test
      - name: Verify combined migrations
        run: npm run test:migrations
      - name: Build the Lambda package
        run: npm run build:lambda:prod
      - name: Verify the Lambda package
        run: npm run verify:lambda:prod
      - name: Keep the package for the release job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambda-package
          path: |
            dist/pitchnest-api-prod.zip
            dist/pitchnest-api-prod.manifest.json
          if-no-files-found: error
          retention-days: 30

  release-dev:
    name: Release to DEV
    needs: package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: release-dev-api
      cancel-in-progress: false
    env:
      FUNCTION_NAME: pitchnest-dev-api
      API_URL: https://l5isutzx18.execute-api.eu-west-2.amazonaws.com
    steps:
      - name: Check out the release script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lambda-package
          path: dist
      - name: Sign in to the DEV account (OIDC, no stored keys)
        id: signin
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEV_ROLE_ARN }}
          role-session-name: deploy-api-dev-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Explain a refused AWS sign-in
        if: failure() && steps.signin.outcome == 'failure'
        env:
          ROLE: ${{ secrets.AWS_DEV_ROLE_ARN }}
        run: bash scripts/explain-aws-signin.sh
      - name: Update and smoke-test the DEV function
        run: bash scripts/release-lambda.sh latest "$FUNCTION_NAME" "$API_URL"
      - name: Deploy the DEV live-pitch server (Render)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEV_DEPLOY_HOOK }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK:-}" ]; then
            echo "::warning::RENDER_DEV_DEPLOY_HOOK is not set, so the DEV Render service was not deployed."
            exit 0
          fi
          curl -fsS -X POST -o /dev/null "${RENDER_DEPLOY_HOOK}&ref=${GITHUB_SHA}"
          echo "DEV Render deploy of ${GITHUB_SHA:0:7} requested"
      - name: Release summary
        run: |
          {
            echo "### DEV updated to ${GITHUB_SHA:0:7}"
            echo "- API: \`$FUNCTION_NAME\` (\$LATEST) at $API_URL"
            echo "- Live-pitch server: Render DEV deploy requested; it is live a few minutes later."
          } >> "$GITHUB_STEP_SUMMARY"

  release-prod:
    name: Release to PROD
    needs: package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: release-prod-api
      cancel-in-progress: false
    env:
      FUNCTION_NAME: pitchnest-prod-api
      API_URL: https://mkrkiditq5.execute-api.eu-west-2.amazonaws.com
    steps:
      - name: Check out the release script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lambda-package
          path: dist
      - name: Sign in to the PROD account (OIDC, no stored keys)
        id: signin
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          role-session-name: deploy-api-prod-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Explain a refused AWS sign-in
        if: failure() && steps.signin.outcome == 'failure'
        env:
          ROLE: ${{ secrets.AWS_PROD_ROLE_ARN }}
        run: bash scripts/explain-aws-signin.sh
      - name: Publish, smoke-test and promote the PROD version
        id: lambda
        run: bash scripts/release-lambda.sh alias "$FUNCTION_NAME" "$API_URL"
      - name: Deploy the PROD live-pitch server (Render)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_PROD_DEPLOY_HOOK }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK:-}" ]; then
            echo "::warning::RENDER_PROD_DEPLOY_HOOK is not set, so the PROD Render service was not deployed. Deploy it by hand."
            exit 0
          fi
          curl -fsS -X POST -o /dev/null "${RENDER_DEPLOY_HOOK}&ref=${GITHUB_SHA}"
          echo "PROD Render deploy of ${GITHUB_SHA:0:7} requested"
      - name: Release summary
        env:
          VERSION: ${{ steps.lambda.outputs.version }}
          PREVIOUS: ${{ steps.lambda.outputs.previous }}
        run: |
          {
            echo "### PROD released ${GITHUB_SHA:0:7}"
            echo "- API: \`$FUNCTION_NAME\` alias \`live\` is on version **$VERSION** (was $PREVIOUS)."
            echo "- Live-pitch server: Render PROD deploy requested; it is live a few minutes later."
            echo "- To undo the API: **Actions → Roll back API → Run workflow** on \`main\`, version **$PREVIOUS**."
          } >> "$GITHUB_STEP_SUMMARY"
